name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk FitPulse.apk
          gh release create "$TAG" FitPulse.apk \
            --title "FitPulse ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android test build from ${GITHUB_SHA::7}. Install by opening FitPulse.apk on an Android phone (allow installs from this source when asked)." \
            --latest
